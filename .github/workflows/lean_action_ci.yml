name: Lean Action CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A new push to master supersedes the previous build: cancel it instead of
# letting stale runs compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: false
          lint: false
